<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dress AI | Fashion Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-400">Dress AI Studio</h1>
        
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <form id="uploadForm" class="space-y-6">
                <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer" required>
                
                <input type="text" id="customStyle" placeholder="Optional: Add a custom style (e.g. Cyberpunk)" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                
                <button type="submit" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-bold transition">Generate Lookbook</button>
            </form>

            <div id="loader" class="hidden mt-8 text-center space-y-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-indigo-500"></div>
                <p id="statusText" class="text-indigo-300 italic">Starting AI stylists...</p>
            </div>

            <div id="zipContainer" class="hidden mt-8 text-center">
                <a id="zipLink" href="#" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-full font-bold">📦 Download All (.zip)</a>
            </div>

            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8"></div>
        </div>
    </div>

    <script>
        const statuses = ["Analyzing pose...", "Dressing in Casual...", "Crafting Formal...", "Finishing Trendy..."];
        
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('statusText');
            const gallery = document.getElementById('gallery');
            const zipContainer = document.getElementById('zipContainer');

            btn.disabled = true;
            loader.classList.remove('hidden');
            zipContainer.classList.add('hidden');
            gallery.innerHTML = "";

            let i = 0;
            const timer = setInterval(() => {
                statusText.innerText = statuses[i % statuses.length];
                i++;
            }, 4000);

            const formData = new FormData();
            formData.append('image', document.getElementById('imageInput').files[0]);
            formData.append('custom_style', document.getElementById('customStyle').value);

            try {
                const res = await fetch('/generate', { method: 'POST', body: formData });
                const data = await res.json();
                
                if(data.results) {
                    data.results.forEach(item => {
                        gallery.innerHTML += `
                            <div class="bg-slate-900 p-2 rounded-xl border border-slate-700">
                                <img src="${item.url}" class="rounded-lg w-full h-auto">
                                <p class="text-xs font-bold mt-2 uppercase text-slate-500">${item.style}</p>
                            </div>`;
                    });
                    document.getElementById('zipLink').href = data.zip_url;
                    zipContainer.classList.remove('hidden');
                } else { alert(data.error); }
            } catch (err) { alert("Server error"); }
            finally {
                clearInterval(timer);
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
